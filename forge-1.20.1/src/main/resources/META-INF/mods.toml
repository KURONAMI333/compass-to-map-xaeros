# Compass to Map: Xaero's edition - Forge 1.20.1 mods.toml
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/compass-to-map-xaeros"
issueTrackerURL="https://www.curseforge.com/minecraft/mc-mods/compass-to-map-xaeros/comments"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="explorerscompass"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="naturescompass"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Xaero's Minimap / World Map: 依存宣言不要 (Reflection で internal API を直叩き)
